name: Build and Release Snip

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Portable Windows Exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --locked

      - name: Build release executable
        run: cargo build --release --locked

      - name: Prepare portable Snip.exe
        shell: pwsh
        run: |
          Copy-Item -Force target/release/snip.exe Snip.exe
          Get-Item Snip.exe | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snip-windows-x64
          path: Snip.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Snip.exe
          generate_release_notes: true
