[package]
name = "snip"
version = "0.1.0"
edition = "2024"
description = "Lightweight portable GIF cropper, real-time previewer, and multi-algorithm scaler"

[dependencies]
eframe = { version = "0.31", default-features = true }
gif = "0.13"
fast_image_resize = "5"
rfd = "0.15"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
